name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Lint
        run: uv run --locked ruff check --output-format=github .
      - name: Check formatting
        run: uv run --locked ruff format --check --diff .
      - name: Type check
        run: uv run --locked ty check
      - name: Build
        run: uv build
