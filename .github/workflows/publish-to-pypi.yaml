name: Publish Python distributions to PyPI
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
  build-and-publish:
    name: Build and publish Python distributions 📦 to PyPI
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish
